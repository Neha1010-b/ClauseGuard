# ============================================================
# Contract Clause Risk Analyzer - Master Configuration
# ============================================================

project:
  name: "Contract Clause Risk Analyzer"
  version: "0.1.0"
  author: "Your Name"
  random_seed: 42

paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  data_reference: "data/reference"
  models_dir: "models"
  logs_dir: "logs"
  cache_dir: ".cache"

# ---------- Document Ingestion ----------
ingestion:
  supported_formats: ["pdf", "docx", "txt"]
  min_text_length: 100
  ocr_fallback: true
  ocr_language: "eng"

# ---------- Clause Segmentation ----------
segmentation:
  numbering_patterns:
    - '(?:^|\n|(?<=\.\s)|(?<=\n))(?P<num>\d+(?:\.\d+)+)\.?\s'
    - '(?:^|\n|(?<=\.\s)|(?<=\n))(?P<num>\d+)\.\s'
    - '(?P<num>\([ivxlcIVXLC]+\))\s'
    - '(?:^|\n)\s*(?P<num>[IVXLC]{1,5})\.\s'
    - '(?P<num>\([a-z]\))\s'
    - '(?:^|\n)\s*(?P<num>[a-z]\.)\s'
    - '(?P<num>ARTICLE\s+[IVXLC]+)\b'
    - '(?P<num>Section\s+\d+(?:\.\d+)*)\b'
    - '(?P<num>Clause\s+\d+(?:\.\d+)*)\b'

  structural_markers:
    - pattern: '^\s*WHEREAS\b'
      role: 'RECITAL'
    - pattern: '^\s*NOW,?\s+THEREFORE\b'
      role: 'RECITAL'
    - pattern: '^\s*BY\s+AND\s+BETWEEN\b'
      role: 'PARTIES'
    - pattern: '^\s*IN\s+WITNESS\s+WHEREOF\b'
      role: 'SIGNATURE'
    - pattern: '^\s*WITNESSETH\b'
      role: 'RECITAL'
    - pattern: '^\s*RECITALS?\b'
      role: 'RECITAL'

  min_clause_length: 20
  max_clause_length: 8000
  min_clause_words: 4
  split_within_lines: true
  max_level: 5
  normalize_quotes: true
  normalize_dashes: true

# ---------- NER ----------
ner:
  spacy_model: "en_core_web_sm"
  entity_types: ["PERSON", "ORG", "DATE", "MONEY", "GPE", "DURATION"]

# ---------- Clause Classification ----------
classification:
  base_model: "distilbert-base-uncased"
  num_labels: 41
  max_length: 256
  batch_size: 16
  learning_rate: 2.0e-5
  epochs: 3
  model_save_path: "models/clause_classifier"

# ---------- Semantic Similarity ----------
embeddings:
  model_name: "sentence-transformers/all-MiniLM-L6-v2"
  embedding_dim: 384
  similarity_threshold: 0.75

# ---------- Reference Bank / FAISS ----------
reference_bank:
  index_type: "IndexFlatL2"
  index_path: "models/faiss_index.bin"
  metadata_path: "models/faiss_metadata.json"

# ---------- Risk Scoring ----------
risk:
  thresholds:
    low: 0.35
    medium: 0.65
    high: 0.85
  weights:
    deviation_from_reference: 0.4
    risky_pattern_score: 0.4
    entity_anomaly_score: 0.2
  categories: ["Financial", "Legal", "Operational", "Ambiguity"]

# ---------- RAG / Explanation ----------
rag:
  llm_provider: "gemini"
  gemini_model: "gemini-1.5-flash"
  max_context_chunks: 5
  max_tokens_response: 512
  temperature: 0.2

# ---------- Backend API ----------
api:
  host: "0.0.0.0"
  port: 8000
  max_upload_size_mb: 20
  request_timeout_sec: 120

# ---------- Logging ----------
logging:
  level: "INFO"
  format: "%(asctime)s | %(levelname)s | %(name)s | %(message)s"
  file: "logs/app.log"