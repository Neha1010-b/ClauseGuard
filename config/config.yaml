# ============================================================
# Contract Clause Risk Analyzer - Master Configuration
# ============================================================

project:
  name: "Contract Clause Risk Analyzer"
  version: "0.5.5"
  author: "Your Name"
  random_seed: 42

paths:
  data_raw: "data/raw"
  data_processed: "data/processed"
  data_reference: "data/reference"
  models_dir: "models"
  logs_dir: "logs"
  cache_dir: ".cache"

# ---------- Document Ingestion ----------
ingestion:
  supported_formats: ["pdf", "docx", "txt"]
  min_text_length: 100
  ocr_fallback: true
  ocr_language: "eng"

# ---------- Clause Segmentation ----------
segmentation:
  numbering_patterns:
    - '(?:^|\n|(?<=\.\s)|(?<=\n))(?P<num>\d+(?:\.\d+)+)\.?\s'
    - '(?:^|\n|(?<=\.\s)|(?<=\n))(?P<num>\d+)\.\s'
    - '(?P<num>\([ivxlcIVXLC]+\))\s'
    - '(?:^|\n)\s*(?P<num>[IVXLC]{1,5})\.\s'
    - '(?P<num>\([a-z]\))\s'
    - '(?:^|\n)\s*(?P<num>[a-z]\.)\s'
    - '(?P<num>ARTICLE\s+[IVXLC]+)\b'
    - '(?P<num>Section\s+\d+(?:\.\d+)*)\b'
    - '(?P<num>Clause\s+\d+(?:\.\d+)*)\b'

  structural_markers:
    - pattern: '^\s*WHEREAS\b'
      role: 'RECITAL'
    - pattern: '^\s*NOW,?\s+THEREFORE\b'
      role: 'RECITAL'
    - pattern: '^\s*BY\s+AND\s+BETWEEN\b'
      role: 'PARTIES'
    - pattern: '^\s*IN\s+WITNESS\s+WHEREOF\b'
      role: 'SIGNATURE'
    - pattern: '^\s*WITNESSETH\b'
      role: 'RECITAL'
    - pattern: '^\s*RECITALS?\b'
      role: 'RECITAL'

  min_clause_length: 20
  max_clause_length: 8000
  min_clause_words: 4
  split_within_lines: true
  max_level: 5
  normalize_quotes: true
  normalize_dashes: true

# ---------- NER ----------
ner:
  spacy_model: "en_core_web_sm"
  entity_types: ["PERSON", "ORG", "DATE", "MONEY", "GPE", "DURATION"]

# ---------- Clause Classification ----------
classification:
  base_model: "distilbert-base-uncased"
  num_labels: 100
  max_length: 256
  batch_size: 16
  learning_rate: 2.0e-5
  epochs: 3
  model_save_path: "models/distilbert_ledgar_100_best"

# ---------- Semantic Similarity ----------
embeddings:
  model_name: "sentence-transformers/all-MiniLM-L6-v2"
  embedding_dim: 384
  similarity_threshold: 0.75

# ---------- Reference Bank / FAISS ----------
reference_bank:
  index_type: "IndexFlatL2"
  index_path: "models/faiss_index.bin"
  metadata_path: "models/faiss_metadata.json"

# ---------- Risk Scoring ----------
risk:
  thresholds:
    low: 0.30
    medium: 0.50
    high: 0.70
  weights:
    deviation_from_reference: 0.4
    risky_pattern_score: 0.4
    entity_anomaly_score: 0.2
  categories: ["Financial", "Legal", "Operational", "Ambiguity"]
  min_confidence_for_risk: 0.25
  placeholder_patterns:
    - '<<[^>]+>>'
    - '_{4,}'
    - '\[INSERT[^\]]*\]'
  label_multipliers:
    Indemnifications: 1.30
    Indemnity: 1.30
    Terminations: 1.25
    Governing Laws: 1.20
    Arbitration: 1.15
    Intellectual Property: 1.20
    Warranties: 1.10
    Representations: 1.10
    Enforceability: 1.15
    Binding Effects: 1.15
    Confidentiality: 1.10
    Insurances: 1.10
    Liabilities: 1.30
    Specific Performance: 1.20
    Remedies: 1.15
    Notices: 0.80
    Counterparts: 0.70
    Headings: 0.60
    Severability: 0.75
    Further Assurances: 0.80
    Entire Agreements: 0.85
    Amendments: 0.85
    Waivers: 0.85

  risky_lexicon:
    # Unilateral power
    - pattern: '\bsolo?\s+discretion\b'
      weight: 0.9
      tag: 'unilateral-discretion'
    - pattern: '\bsole\s+(?:and\s+absolute\s+)?discretion\b'
      weight: 0.9
      tag: 'unilateral-discretion'
    - pattern: '\bat\s+any\s+time\b'
      weight: 0.5
      tag: 'unilateral-timing'
    - pattern: '\bwith\s+or\s+without\s+cause\b'
      weight: 0.8
      tag: 'no-cause'
    - pattern: '\bwithout\s+(?:prior\s+)?notice\b'
      weight: 0.7
      tag: 'no-notice'
    - pattern: '\bwithout\s+(?:any\s+)?liabilit(?:y|ies)\b'
      weight: 0.8
      tag: 'no-liability'

    # Unlimited scope
    - pattern: '\bwithout\s+limitation\b'
      weight: 0.5
      tag: 'unlimited-scope'
    - pattern: '\bany\s+and\s+all\b'
      weight: 0.5
      tag: 'unlimited-scope'
    - pattern: '\bwhatsoever\b'
      weight: 0.4
      tag: 'unlimited-scope'
    - pattern: '\bin\s+perpetuity\b'
      weight: 0.9
      tag: 'perpetual'
    - pattern: '\birrevocably\b'
      weight: 0.5
      tag: 'irrevocable'

    # Waivers
    - pattern: '\bwaive[sd]?\s+(?:all|any)\b'
      weight: 0.6
      tag: 'waiver'
    - pattern: '\bno\s+waiver\b'
      weight: 0.3
      tag: 'waiver'

    # Auto-renewal traps
    - pattern: '\bautomatically?\s+renew'
      weight: 0.7
      tag: 'auto-renew'
    - pattern: '\bevergreen\b'
      weight: 0.7
      tag: 'auto-renew'

    # Non-compete/non-solicit extremes
    - pattern: '\bnon-?compet(?:e|ition)\b'
      weight: 0.6
      tag: 'non-compete'
    - pattern: '\bnon-?solicit\b'
      weight: 0.5
      tag: 'non-solicit'

    # Assignment/ownership extremes
    - pattern: '\birrevocably\s+assign'
      weight: 0.7
      tag: 'assignment'
    - pattern: '\bwithout\s+(?:additional\s+)?compensation\b'
      weight: 0.6
      tag: 'uncompensated'

    # Time-pressure
    - pattern: '\bimmediately\s+upon\b'
      weight: 0.5
      tag: 'immediate'

    # Indemnification without cap
    - pattern: '\bhold\s+harmless\b'
      weight: 0.5
      tag: 'indemnify'

          # ---- Natural-language variants (Fix B) ----

    # Non-compete phrased naturally
    - pattern: '\bshall\s+not\b.{0,40}\bcompete\b'
      weight: 0.75
      tag: 'non-compete'
    - pattern: '\bnot\s+engage\b.{0,60}\bcompeting\b'
      weight: 0.70
      tag: 'non-compete'
    - pattern: '\banywhere\s+in\b'
      weight: 0.45
      tag: 'non-compete'
    - pattern: '\bthroughout\s+the\s+world\b'
      weight: 0.55
      tag: 'non-compete'

    # Duration extremes
    - pattern: '\b(?:five|ten|7|8|9|10)\s*\(?\s*(?:five|ten|seven|eight|nine|ten)\s*\)?\s*years?\b'
      weight: 0.55
      tag: 'long-duration'
    - pattern: '\bfor\s+a\s+period\s+of\s+(?:five|ten|seven|eight|nine|10)\b'
      weight: 0.55
      tag: 'long-duration'

    # Auto-renewal phrasing
    - pattern: '\bshall\s+(?:be\s+)?automatically?\s+(?:renew|extend)'
      weight: 0.80
      tag: 'auto-renew'
    - pattern: '\b(?:one|two)\s+hundred\s+(?:eighty|ninety|twenty|forty|sixty)\s*\(?\s*1?8?0?\s*\)?\s*days?\b'
      weight: 0.60
      tag: 'long-notice'
    - pattern: '\b(?:90|120|180|270|365)\s*\([^)]+\)\s*days?\b'
      weight: 0.55
      tag: 'long-notice'

    # Sole discretion variants
    - pattern: '\bsole\s+discretion\b'
      weight: 0.90
      tag: 'unilateral-discretion'
    - pattern: '\bwithout\s+(?:prior\s+)?notice\b'
      weight: 0.70
      tag: 'no-notice'

    # Unilateral powers
    - pattern: '\bmay\s+(?:at\s+its\s+option\s+)?(?:unilaterally|modify|amend|change)'
      weight: 0.55
      tag: 'unilateral-change'
    - pattern: '\bshall\s+have\s+the\s+right\s+to\b.{0,30}\bsuspend\b'
      weight: 0.65
      tag: 'unilateral-suspension'

    # Waiver variants
    - pattern: '\bwaive[sd]?\b'
      weight: 0.45
      tag: 'waiver'
    - pattern: '\bwaives?\s+all\b'
      weight: 0.65
      tag: 'waiver'

  override:
    risky_lang_medium_floor: 0.65
    risky_lang_high_floor: 0.85
    medium_score_floor: 0.50
    high_score_floor: 0.70

# ---------- RAG / Explanation ----------
rag:
  llm_provider: "gemini"
  primary_model: "gemini-3.5-flash"
  fallback_models:
    - "gemini-3.8-flash"
  temperature: 0.2
  max_output_tokens: 2000
  thinking_budget: 0 
  request_timeout_sec: 30
  max_retries: 2
  # Minimum risk level at which we generate an LLM explanation
  # (low-risk clauses get the short hint only, saving API calls)
  explain_at_or_above: "medium"

# ---------- Backend API ----------
api:
  host: "0.0.0.0"
  port: 8000
  max_upload_size_mb: 20
  request_timeout_sec: 120

# ---------- Logging ----------
logging:
  level: "INFO"
  format: "%(asctime)s | %(levelname)s | %(name)s | %(message)s"
  file: "logs/app.log"